<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OHA Studio · Risk2Safe</title>
<meta name="description" content="Occupational hygiene assessment studio: OHID, SEGs, OHRA, exposure statistics (AIHA and EN 689) and report generation. Runs entirely in your browser.">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EDF1F3; --panel:#FFFFFF; --ink:#16232B; --steel:#55656F; --mute:#7B8A93;
  --rule:#D3DBE0; --rule-strong:#B7C3CA; --accent:#1D5FA8; --accent-ink:#164C87; --accent-soft:#E4EEF8;
  --ok:#2E7A4B; --ok-soft:#E3F1E8; --warn:#9A5F0C; --warn-soft:#FBF0DC; --crit:#B3261E; --crit-soft:#FBE6E4;
  --c0:#D3E6F1; --c1:#A6D1B6; --c2:#EAD88F; --c3:#EBA960; --c4:#CC4B3F;
  --sans:'Public Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  --serif:'Source Serif 4', Georgia, 'Times New Roman', serif;
  --r-sm:4px; --r-md:8px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.5 var(--sans);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
.app{display:grid;grid-template-columns:248px 1fr;grid-template-rows:56px 1fr;height:100vh}
header.top{grid-column:1/3;display:flex;align-items:center;gap:16px;padding:0 20px;background:var(--panel);border-bottom:1px solid var(--rule)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.brand svg{flex:none}
.brand small{font-weight:500;color:var(--steel)}
.eng-title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--steel)}
.eng-title b{color:var(--ink);font-weight:600}
.save-state{font-size:12px;color:var(--mute);white-space:nowrap}
.top .actions{display:flex;gap:8px}
nav.rail{background:var(--panel);border-right:1px solid var(--rule);overflow-y:auto;padding:16px 0 24px}
.train{position:relative;margin:0;padding:0;list-style:none}
.train::before{content:"";position:absolute;left:31px;top:14px;bottom:14px;width:2px;background:var(--rule)}
.step{position:relative}
.step button{display:grid;grid-template-columns:24px 1fr;gap:12px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:8px 16px 8px 20px;cursor:pointer;border-left:3px solid transparent}
.step button:hover{background:var(--paper)}
.step button[aria-current="page"]{background:var(--accent-soft);border-left-color:var(--accent)}
.dot{position:relative;z-index:1;width:24px;height:24px;border-radius:50%;border:2px solid var(--rule-strong);background:var(--panel);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--steel)}
.dot.started{border-color:var(--accent);color:var(--accent)}
.dot.done{background:var(--accent);border-color:var(--accent);color:#fff}
.step .lbl{display:flex;flex-direction:column;line-height:1.25}
.step .lbl b{font-weight:600;font-size:13.5px}
.step .lbl span{font-size:12px;color:var(--steel)}
.rail-sep{height:1px;background:var(--rule);margin:14px 20px}
.rail-links button{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;background:none;padding:8px 20px;text-align:left;cursor:pointer;font-weight:500;border-left:3px solid transparent}
.rail-links button:hover{background:var(--paper)}
.rail-links button[aria-current="page"]{background:var(--accent-soft);border-left-color:var(--accent)}
.badge{display:inline-block;min-width:20px;padding:0 6px;border-radius:10px;font-size:11.5px;font-weight:700;text-align:center;line-height:18px}
.badge.crit{background:var(--crit);color:#fff}.badge.warn{background:var(--warn-soft);color:var(--warn)}.badge.ok{background:var(--ok-soft);color:var(--ok)}
main{overflow:auto;padding:24px 28px 64px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
h1{font-size:22px;line-height:1.2;margin:0;letter-spacing:-.015em}
.page-head p{margin:4px 0 0;color:var(--steel);max-width:72ch}
h2{font-size:16px;margin:0 0 4px;letter-spacing:-.005em}
h3{font-size:14px;margin:16px 0 6px}
.sec{background:var(--panel);border:1px solid var(--rule);border-radius:var(--r-md);padding:18px 20px;margin-bottom:16px}
.sec>p.hint,.hint{color:var(--steel);margin:0 0 12px;max-width:80ch;font-size:13px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px 16px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12.5px;font-weight:600;color:var(--steel)}
.field input,.field select,.field textarea{border:1px solid var(--rule-strong);border-radius:var(--r-sm);padding:7px 9px;background:#fff}
.field textarea{resize:vertical;min-height:64px}
input:disabled,select:disabled,textarea:disabled{background:var(--paper);color:var(--steel)}
.checks{display:flex;flex-wrap:wrap;gap:6px 18px;margin:4px 0 8px}
.checks label{display:flex;gap:6px;align-items:center;font-weight:500;color:var(--ink);font-size:13.5px}
.btn{border:1px solid var(--rule-strong);background:var(--panel);border-radius:var(--r-sm);padding:7px 12px;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--steel)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-ink)}
.btn.ghost{border-style:dashed;margin-top:8px;color:var(--accent)}
.btn.danger{color:var(--crit)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tw{overflow-x:auto;border:1px solid var(--rule);border-radius:var(--r-sm)}
table.grid{border-collapse:collapse;width:100%;font-size:13px}
.grid th{background:#F5F7F8;text-align:left;font-weight:600;color:var(--steel);padding:7px 8px;border-bottom:1px solid var(--rule);white-space:nowrap;font-size:12.5px}
.grid td{border-bottom:1px solid var(--rule);padding:3px 4px;vertical-align:top}
.grid tr:last-child td{border-bottom:0}
.grid input[type=text],.grid input[type=number],.grid input[type=date],.grid select,.grid textarea{width:100%;min-width:90px;border:1px solid transparent;background:transparent;padding:5px 6px;border-radius:3px}
.grid input:hover,.grid select:hover,.grid textarea:hover{border-color:var(--rule)}
.grid input:focus,.grid select:focus,.grid textarea:focus{border-color:var(--accent);background:#fff;outline:none}
.grid input[type=checkbox]{margin:8px}
.grid td.act,.grid th.act{width:32px;text-align:center}
.grid td.empty{padding:14px;color:var(--mute);text-align:center}
.grid .calc{display:block;padding:5px 6px;white-space:nowrap}
.icon{border:0;background:none;cursor:pointer;color:var(--mute);font-size:18px;line-height:1;padding:4px 8px;border-radius:3px}
.icon:hover{color:var(--crit);background:var(--crit-soft)}
table.kv{border-collapse:collapse;font-size:13px;width:100%}
.kv th{text-align:left;color:var(--steel);font-weight:500;padding:4px 12px 4px 0;white-space:nowrap;width:1%}
.kv td{padding:4px 0}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.crit{background:var(--crit-soft);color:var(--crit)}.pill.info{background:var(--accent-soft);color:var(--accent-ink)}.pill.none{background:var(--paper);color:var(--steel)}
.cat{display:inline-grid;place-items:center;width:26px;height:22px;border-radius:4px;font-weight:700;font-size:12px;color:var(--ink)}
.cat0{background:var(--c0)}.cat1{background:var(--c1)}.cat2{background:var(--c2)}.cat3{background:var(--c3)}.cat4{background:var(--c4);color:#fff}
.split{display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:start}
.split>*,.stats-grid>*,.cols>*{min-width:0}
.plist{background:var(--panel);border:1px solid var(--rule);border-radius:var(--r-md);overflow:hidden;position:sticky;top:0}
.plist button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--rule);background:none;padding:10px 14px;cursor:pointer}
.plist button:last-child{border-bottom:0}
.plist button:hover{background:var(--paper)}
.plist button[aria-current="true"]{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.plist b{display:block;font-size:13.5px}
.plist span{font-size:12px;color:var(--steel)}
.stats-grid{display:grid;grid-template-columns:minmax(260px,1fr) minmax(320px,1.3fr);gap:16px}
.plot svg{width:100%;height:auto;display:block}
.flag{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:start;padding:10px 0;border-bottom:1px solid var(--rule)}
.flag:last-child{border-bottom:0}
.flag .where{font-size:12px;color:var(--steel)}
.callout{border-left:3px solid var(--accent);background:var(--accent-soft);padding:10px 14px;border-radius:0 var(--r-sm) var(--r-sm) 0;margin:0 0 12px;font-size:13px}
.callout.warn{border-color:var(--warn);background:var(--warn-soft)}
.callout.crit{border-color:var(--crit);background:var(--crit-soft)}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.metric{border:1px solid var(--rule);border-radius:var(--r-sm);padding:10px 12px}
.metric b{display:block;font-size:20px;line-height:1.2}
.metric span{font-size:12px;color:var(--steel)}
.heat{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:8px}
.heat div{border-radius:4px;padding:8px;text-align:center;font-size:12px}
.heat div b{display:block;font-size:18px}
iframe.report{width:100%;height:78vh;border:1px solid var(--rule);border-radius:var(--r-sm);background:#fff}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;word-break:break-all}
dialog{border:1px solid var(--rule);border-radius:var(--r-md);padding:20px;max-width:520px;width:92vw}
dialog::backdrop{background:rgba(22,35,43,.45)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:var(--r-sm);font-size:13px;z-index:50;opacity:0;transition:opacity .2s}
.toast.show{opacity:1}
.landing{max-width:760px}
.landing h1{font-size:30px;letter-spacing:-.02em}
.landing ol{padding-left:20px;color:var(--steel)}
.landing ol b{color:var(--ink)}
@media (max-width:900px){.app{grid-template-columns:1fr;grid-template-rows:auto auto 1fr}header.top{flex-wrap:wrap;padding:8px 14px;height:auto}nav.rail{border-right:0;border-bottom:1px solid var(--rule);max-height:210px}.split,.stats-grid{grid-template-columns:1fr}.plist{position:static}main{padding:16px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{.app>header,.app>nav{display:none}}
</style>

<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#1D5FA8"/><path d="M7 23 L13 15 L18 19 L25 8" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/></svg>
      <span>OHA Studio <small>Risk2Safe</small></span>
    </div>
    <div class="eng-title" id="engTitle"></div>
    <span class="save-state" id="saveState" aria-live="polite"></span>
    <div class="actions">
      <button class="btn" data-act="openFile">Open file</button>
      <button class="btn primary" data-act="saveFile">Save file</button>
    </div>
  </header>
  <nav class="rail" id="rail" aria-label="Workflow"></nav>
  <main id="main" tabindex="-1"></main>
</div>
<input type="file" id="fileIn" accept=".json,.ohs,.ohs.json,application/json" hidden>
<input type="file" id="csvIn" accept=".csv,text/csv" hidden>
<dialog id="dlg"></dialog>
<div class="toast" id="toast" role="status"></div>
<script>
/*STATS-BEGIN*/
const OHStats = (() => {
  const VERSION = '1.0.0';

  // ---------- basic distributions ----------
  function normCdf(x) {
    // W. J. Cody-style erfc via rational approximation (abs error < 1.2e-7)
    const z = Math.abs(x) / Math.SQRT2;
    const t = 1 / (1 + 0.5 * z);
    const r = t * Math.exp(-z * z - 1.26551223 + t * (1.00002368 + t * (0.37409196 + t * (0.09678418 +
      t * (-0.18628806 + t * (0.27886807 + t * (-1.13520398 + t * (1.48851587 + t * (-0.82215223 + t * 0.17087277)))))))));
    return x >= 0 ? 1 - r / 2 : r / 2;
  }
  function normInv(p) {
    // Acklam's algorithm with one Newton refinement step
    if (p <= 0) return -Infinity; if (p >= 1) return Infinity;
    const a = [-3.969683028665376e+01, 2.209460984245205e+02, -2.759285104469687e+02, 1.383577518672690e+02, -3.066479806614716e+01, 2.506628277459239e+00];
    const b = [-5.447609879822406e+01, 1.615858368580409e+02, -1.556989798598866e+02, 6.680131188771972e+01, -1.328068155288572e+01];
    const c = [-7.784894002430293e-03, -3.223964580411365e-01, -2.400758277161838e+00, -2.549732539343734e+00, 4.374664141464968e+00, 2.938163982698783e+00];
    const d = [7.784695709041462e-03, 3.224671290700398e-01, 2.445134137142996e+00, 3.754408661907416e+00];
    const pl = 0.02425; let q, r, x;
    if (p < pl) { q = Math.sqrt(-2 * Math.log(p)); x = (((((c[0] * q + c[1]) * q + c[2]) * q + c[3]) * q + c[4]) * q + c[5]) / ((((d[0] * q + d[1]) * q + d[2]) * q + d[3]) * q + 1); }
    else if (p <= 1 - pl) { q = p - 0.5; r = q * q; x = (((((a[0] * r + a[1]) * r + a[2]) * r + a[3]) * r + a[4]) * r + a[5]) * q / (((((b[0] * r + b[1]) * r + b[2]) * r + b[3]) * r + b[4]) * r + 1); }
    else { q = Math.sqrt(-2 * Math.log(1 - p)); x = -(((((c[0] * q + c[1]) * q + c[2]) * q + c[3]) * q + c[4]) * q + c[5]) / ((((d[0] * q + d[1]) * q + d[2]) * q + d[3]) * q + 1); }
    const e = normCdf(x) - p; const u = e * Math.sqrt(2 * Math.PI) * Math.exp(x * x / 2);
    return x - u / (1 + x * u / 2);
  }
  function lgamma(x) {
    const g = 7, cf = [0.99999999999980993, 676.5203681218851, -1259.1392167224028, 771.32342877765313, -176.61502916214059, 12.507343278686905, -0.13857109526572012, 9.9843695780195716e-6, 1.5056327351493116e-7];
    if (x < 0.5) return Math.log(Math.PI / Math.abs(Math.sin(Math.PI * x))) - lgamma(1 - x);
    x -= 1; let a = cf[0]; const t = x + g + 0.5;
    for (let i = 1; i < g + 2; i++) a += cf[i] / (x + i);
    return 0.5 * Math.log(2 * Math.PI) + (x + 0.5) * Math.log(t) - t + Math.log(a);
  }

  // Noncentral t CDF: P(T <= t), T = (Z + delta) / S, S = sqrt(V/nu), V ~ chi2(nu)
  function nctCdf(t, nu, delta) {
    const N = 4000, smax = 1 + 14 / Math.sqrt(2 * nu) + 2;
    const h = smax / N;
    const lc = Math.log(2) + (nu / 2) * Math.log(nu / 2) - lgamma(nu / 2);
    const f = s => s <= 0 ? 0 : Math.exp(lc + (nu - 1) * Math.log(s) - nu * s * s / 2) * normCdf(t * s - delta);
    let sum = f(0) + f(smax);
    for (let i = 1; i < N; i++) sum += f(i * h) * (i % 2 ? 4 : 2);
    return Math.min(1, Math.max(0, sum * h / 3));
  }
  function nctInv(p, nu, delta) {
    let lo = delta - 10, hi = delta + 10;
    while (nctCdf(lo, nu, delta) > p) lo -= 10;
    while (nctCdf(hi, nu, delta) < p) hi += 10;
    for (let i = 0; i < 80; i++) { const m = (lo + hi) / 2; if (nctCdf(m, nu, delta) < p) lo = m; else hi = m; }
    return (lo + hi) / 2;
  }
  const tInv = (p, nu) => nctInv(p, nu, 0);

  // One-sided tolerance factor: UCL(gamma) of the p-th percentile = exp(ybar + K s)
  function kFactor(n, p, gamma) { return nctInv(gamma, n - 1, normInv(p) * Math.sqrt(n)) / Math.sqrt(n); }

  // ---------- shift adjustment ----------
  function briefScala(hoursPerShift) {
    const h = Number(hoursPerShift);
    if (!h || h <= 8) return 1;
    return (8 / h) * ((24 - h) / 16);
  }

  // ---------- non-detects: robust ROS (Helsel 2005), multiple detection limits ----------
  function ros(obs) {
    const det = obs.filter(o => !o.nd).map(o => o.v);
    const nds = obs.filter(o => o.nd).map(o => o.v);
    if (!nds.length) return { values: det.slice(), method: 'No non-detects', imputed: 0 };
    const frac = nds.length / obs.length;
    if (det.length < 3 || frac > 0.8) {
      return { values: det.concat(nds.map(v => v / Math.SQRT2)), method: 'Substitution LOD/\u221A2 (too few detects for ROS)', imputed: nds.length, fallback: true };
    }
    const dls = [...new Set(nds)].sort((a, b) => a - b), J = dls.length;
    const pe = new Array(J + 1).fill(0);
    for (let j = J - 1; j >= 0; j--) {
      const lo = dls[j], hi = j + 1 < J ? dls[j + 1] : Infinity;
      const A = det.filter(x => x >= lo && x < hi).length;
      const B = det.filter(x => x < lo).length + nds.filter(x => x <= lo).length;
      pe[j] = pe[j + 1] + (A + B > 0 ? (A / (A + B)) * (1 - pe[j + 1]) : 0);
    }
    const pts = []; // detects: {p, v}
    const below = det.filter(x => x < dls[0]).sort((a, b) => a - b);
    below.forEach((v, i) => pts.push({ p: (1 - pe[0]) * (i + 1) / (below.length + 1), v }));
    for (let j = 0; j < J; j++) {
      const lo = dls[j], hi = j + 1 < J ? dls[j + 1] : Infinity;
      const grp = det.filter(x => x >= lo && x < hi).sort((a, b) => a - b);
      grp.forEach((v, i) => pts.push({ p: (1 - pe[j]) + (pe[j] - pe[j + 1]) * (i + 1) / (grp.length + 1), v }));
    }
    const xs = pts.map(q => normInv(q.p)), ys = pts.map(q => Math.log(q.v));
    const mx = mean(xs), my = mean(ys);
    let sxy = 0, sxx = 0; xs.forEach((x, i) => { sxy += (x - mx) * (ys[i] - my); sxx += (x - mx) ** 2; });
    const slope = sxy / sxx, icpt = my - slope * mx;
    const imputed = [];
    for (let j = 0; j < J; j++) {
      const c = nds.filter(x => x === dls[j]).length;
      for (let r = 1; r <= c; r++) imputed.push(Math.exp(icpt + slope * normInv((1 - pe[j]) * r / (c + 1))));
    }
    return { values: det.concat(imputed), method: 'Robust ROS (Helsel)', imputed: imputed.length };
  }

  const mean = a => a.reduce((s, x) => s + x, 0) / a.length;
  const sd = a => { const m = mean(a); return Math.sqrt(a.reduce((s, x) => s + (x - m) ** 2, 0) / (a.length - 1)); };

  // Probability-plot correlation coefficient on logs (lognormal fit check)
  function ppcc(values) {
    const y = values.map(Math.log).sort((a, b) => a - b), n = y.length;
    const x = y.map((_, i) => normInv((i + 1 - 0.375) / (n + 0.25)));
    const mx = mean(x), my = mean(y); let sxy = 0, sxx = 0, syy = 0;
    x.forEach((xi, i) => { sxy += (xi - mx) * (y[i] - my); sxx += (xi - mx) ** 2; syy += (y[i] - my) ** 2; });
    return syy === 0 ? 1 : sxy / Math.sqrt(sxx * syy);
  }

  function efUCL(n, ybar, s, lnOel, gamma) {
    const tObs = Math.sqrt(n) * (lnOel - ybar) / s;
    let lo = -60, hi = 60;
    for (let i = 0; i < 70; i++) { const m = (lo + hi) / 2; if (nctCdf(tObs, n - 1, m) > gamma) lo = m; else hi = m; }
    return normCdf(-((lo + hi) / 2) / Math.sqrt(n));
  }

  const EN689_PRELIM = { 3: 0.1, 4: 0.15, 5: 0.2 };
  function aihaCategory(ratio) {
    if (ratio <= 0.01) return 0; if (ratio <= 0.1) return 1; if (ratio <= 0.5) return 2; if (ratio <= 1) return 3; return 4;
  }

  // Main analysis. obs: [{v, nd}], oel: number in same unit (already shift-adjusted if required)
  function analyse(obs, oel, opt = {}) {
    const gA = opt.confAIHA || 0.95, gE = opt.confEN || 0.70;
    const n = obs.length, out = { n, nd: obs.filter(o => o.nd).length, engine: VERSION, oel, flags: [] };
    if (!n) return out;
    out.max = Math.max(...obs.map(o => o.v));
    out.min = Math.min(...obs.map(o => o.v));
    // EN 689 preliminary test (3-5 samples)
    if (n >= 3 && n <= 5 && oel) {
      const thr = EN689_PRELIM[n] * oel;
      if (obs.some(o => !o.nd && o.v > oel)) out.en689 = { test: 'Preliminary', outcome: 'Non-compliance', note: 'A result exceeds the OEL.' };
      else if (obs.every(o => o.v < thr)) out.en689 = { test: 'Preliminary', outcome: 'Compliance', note: `All results below ${EN689_PRELIM[n]} \u00D7 OEL.` };
      else out.en689 = { test: 'Preliminary', outcome: 'No decision', note: 'Collect at least 6 samples for the statistical test.' };
    }
    if (n < 2) { out.flags.push('Fewer than 2 results: no statistics.'); return out; }
    const r = ros(obs); out.censorMethod = r.method; out.imputed = r.imputed;
    if (r.fallback) out.flags.push('Too few detects for ROS; substitution used (labelled fallback).');
    const y = r.values.map(Math.log), ybar = mean(y), s = sd(y);
    out.gm = Math.exp(ybar); out.gsd = Math.exp(s);
    out.am = Math.exp(ybar + s * s / 2);
    out.x95 = Math.exp(ybar + 1.6448536 * s);
    out.ppcc = ppcc(r.values);
    if (n >= 3) {
      out.kAIHA = kFactor(n, 0.95, gA); out.x95ucl = Math.exp(ybar + out.kAIHA * s);
      const tq = tInv(0.95, n - 1);
      out.amUclCox = Math.exp(ybar + s * s / 2 + tq * Math.sqrt(s * s / n + s ** 4 / (2 * (n - 1))));
    }
    if (out.gsd > 3) out.flags.push('GSD > 3: review SEG homogeneity (EN 689).');
    if (out.nd / n > 0.5) out.flags.push('More than 50% non-detects.');
    if (out.ppcc < 0.9 && n >= 5) out.flags.push('Poor lognormal fit (probability-plot r < 0.90): check for mixed groups.');
    if (oel && s > 0) {
      const lnO = Math.log(oel);
      out.ef = 1 - normCdf((lnO - ybar) / s);
      if (n >= 3) out.efUcl = efUCL(n, ybar, s, lnO, gA);
      out.ratioX95 = out.x95 / oel;
      out.aihaCat = aihaCategory(out.x95 / oel);
      if (out.x95ucl) out.aihaCatUcl = aihaCategory(out.x95ucl / oel);
      if (n >= 6) {
        const UT = kFactor(n, 0.95, gE), UR = (lnO - ybar) / s;
        out.en689 = { test: 'Statistical', UT, UR, utl: Math.exp(ybar + UT * s),
          outcome: UR >= UT ? 'Compliance' : 'Non-compliance',
          note: `UTL(${Math.round(gE * 100)}%, 95%) = ${fmt(Math.exp(ybar + UT * s))} vs OEL ${fmt(oel)}.` };
      }
    }
    out.plot = plotPoints(r.values, obs);
    return out;
  }

  function plotPoints(values, obs) {
    const ndCount = obs.filter(o => o.nd).length, detCount = obs.length - ndCount;
    const sorted = values.map((v, i) => ({ v, imputed: i >= detCount })).sort((a, b) => a.v - b.v), n = sorted.length;
    return sorted.map((p, i) => ({ z: normInv((i + 1 - 0.375) / (n + 0.25)), v: p.v, imputed: p.imputed && ndCount > 0 }));
  }

  function fmt(x, d = 3) {
    if (x === undefined || x === null || isNaN(x)) return '\u2013';
    if (x === 0) return '0';
    const a = Math.abs(x);
    if (a >= 1000) return x.toFixed(0);
    return Number(x.toPrecision(d)).toString();
  }

  return { VERSION, normCdf, normInv, nctCdf, nctInv, tInv, kFactor, briefScala, ros, ppcc, efUCL, aihaCategory, analyse, fmt, mean, sd };
})();
/*STATS-END*/

function tableEditor(col, cols, o = {}) {

function cell(col, r, c, ro) {

function nextSteps() {
  const s = [];
  if (!S.decision.locked) s.push(['engagement', 'Lock the decision standard with the client.']);
  if (!S.areas.length) s.push(['ohid', 'Add the areas and units in scope.']);
  if (!S.oels.length && S.agents.length) s.push(['ohid', 'Enter OELs for the agents from your licensed sources.']);
  if (!S.segs.length) s.push(['segs', 'Form the first similar exposure groups.']);
  if (S.segs.length && !S.profiles.length) s.push(['ohra', 'Create exposure profiles and rate them.']);
  const und = S.profiles.filter(p => S.samples.some(x => x.profileId === p.id) && (p.decCat === undefined || p.decCat === '' || p.decCat == null));
  if (und.length) s.push(['exposure', `Record decisions for ${und.length} profile(s) with results.`]);
  const fl = qaFlags(); if (fl.some(f => f.sev === 'Block')) s.push(['qa', 'Fix blocking QA items.']);
  if (!s.length) s.push(['report', 'Generate and review the report.']);
  return `<table class="kv">${s.map(([t, m]) => `<tr><td>${esc(m)}</td><td style="text-align:right"><button class="btn" data-act="tab" data-tab="${t}">Open</button></td></tr>`).join('')}</table>`;
}
function segValidation() {
  const rows = S.profiles.map(p => ({ p, a: analyseProfile(p) })).filter(x => x.a.n >= 2);
  if (!rows.length) return '<p class="hint">No profiles with 2 or more results yet.</p>';
  return `<div class="tw"><table class="grid"><thead><tr><th>Profile</th><th>n</th><th>GSD</th><th>Fit r</th><th>Individuals above 2\u00D7 GM</th><th>Check</th></tr></thead><tbody>${rows.map(({ p, a }) => {
    const smp = S.samples.filter(s => s.profileId === p.id && !s.blank && !s.excluded && s.value > 0 && !s.nd);
    const byW = {}; smp.forEach(s => { const w = s.worker || '(unnamed)'; (byW[w] = byW[w] || []).push(s.value); });
    const hi = Object.entries(byW).filter(([, v]) => Math.exp(OHStats.mean(v.map(Math.log))) > 2 * a.stats.gm).map(([w]) => w);
    const bad = a.stats.gsd > 3 || hi.length || a.stats.ppcc < 0.9;
    return `<tr><td><span class="calc">${esc(profLabel(p))}</span></td><td><span class="calc">${a.n}</span></td><td><span class="calc">${F(a.stats.gsd)}</span></td><td><span class="calc">${F(a.stats.ppcc)}</span></td><td><span class="calc">${esc(hi.join(', ') || 'None')}</span></td><td><span class="calc">${bad ? '<span class="pill warn">Review grouping</span>' : '<span class="pill ok">No flag</span>'}</span></td></tr>`;
  }).join('')}</tbody></table></div>`;
}
function riskMatrix() {
  let h = '<div class="tw"><table class="grid" style="width:auto"><thead><tr><th>Health effect \u2193 / Exposure \u2192</th>' + [0, 1, 2, 3, 4].map(e => `<th>${e}</th>`).join('') + '</tr></thead><tbody>';
  for (let her = 4; her >= 1; her--) {
    h += `<tr><th>${her}</th>`;
    for (let e = 0; e <= 4; e++) {
      const ps = S.profiles.filter(p => Number(p.her) === her && Number(p.erc) === e && p.erc !== '' && p.erc != null);
      const s = e * her, bg = s >= 12 ? 'var(--crit-soft)' : s >= 6 ? 'var(--warn-soft)' : s >= 3 ? 'var(--accent-soft)' : 'var(--ok-soft)';
      h += `<td style="background:${bg};min-width:120px;font-size:12px">${ps.map(p => esc(profLabel(p))).join('<br>') || '&nbsp;'}</td>`;
    }

  return h + '</tbody></table></div><p class="hint" style="margin-top:8px">Score = exposure \u00D7 health effect: 12+ high, 6\u201311 medium, 3\u20135 low. Replace with the client matrix if required.</p>';

// ---------------- log-probability plot ----------------
function logProbPlot(st, oel, unit) {
  if (!st.plot || st.plot.length < 2) return '';
  const W = 460, H = 320, ml = 56, mr = 16, mt = 16, mb = 44, pw = W - ml - mr, ph = H - mt - mb;
  const vals = st.plot.map(p => p.v).concat(oel ? [oel] : []).concat([st.x95]);
  let lo = Math.floor(Math.log10(Math.min(...vals) / 1.2)), hi = Math.ceil(Math.log10(Math.max(...vals) * 1.2));
  if (hi === lo) hi = lo + 1;
  const zmin = -2.6, zmax = 2.6, X = z => ml + (z - zmin) / (zmax - zmin) * pw, Y = v => mt + ph - (Math.log10(v) - lo) / (hi - lo) * ph;
  const pcts = [1, 5, 10, 25, 50, 75, 90, 95, 99];
  let g = '';
  pcts.forEach(pc => { const x = X(OHStats.normInv(pc / 100)); g += `<line x1="${x}" x2="${x}" y1="${mt}" y2="${mt + ph}" stroke="#E2E8EC"/><text x="${x}" y="${mt + ph + 16}" font-size="10.5" text-anchor="middle" fill="#55656F">${pc}</text>`; });
  for (let d = lo; d <= hi; d++) { const y = Y(10 ** d); g += `<line x1="${ml}" x2="${ml + pw}" y1="${y}" y2="${y}" stroke="#D3DBE0"/><text x="${ml - 6}" y="${y + 3.5}" font-size="10.5" text-anchor="end" fill="#55656F">${F(10 ** d)}</text>`; for (let m = 2; m < 10 && d < hi; m++) { const y2 = Y(m * 10 ** d); g += `<line x1="${ml}" x2="${ml + pw}" y1="${y2}" y2="${y2}" stroke="#EEF2F4"/>`; } }
  const lgm = Math.log(st.gm), ls = Math.log(st.gsd), fit = z => Math.exp(lgm + ls * z);
  const cid = 'pc' + Math.random().toString(36).slice(2, 8);
  const fl = `<clipPath id="${cid}"><rect x="${ml}" y="${mt}" width="${pw}" height="${ph}"/></clipPath><line clip-path="url(#${cid})" x1="${X(zmin)}" y1="${Y(fit(zmin))}" x2="${X(zmax)}" y2="${Y(fit(zmax))}" stroke="#55656F" stroke-dasharray="4 3"/>`;
  const ol = oel ? `<line x1="${ml}" x2="${ml + pw}" y1="${Y(oel)}" y2="${Y(oel)}" stroke="#B3261E" stroke-width="1.5"/><text x="${ml + pw - 4}" y="${Y(oel) - 5}" font-size="11" text-anchor="end" fill="#B3261E" font-weight="600">OEL ${F(oel)}</text>` : '';
  const pts = st.plot.map(p => `<circle cx="${X(p.z)}" cy="${Y(p.v)}" r="4.2" fill="${p.imputed ? '#fff' : '#1D5FA8'}" stroke="#1D5FA8" stroke-width="1.5"><title>${F(p.v)} ${esc(unit)}${p.imputed ? ' (imputed non-detect)' : ''}</title></circle>`).join('');
  const x95 = `<circle cx="${X(1.6449)}" cy="${Y(st.x95)}" r="5" fill="none" stroke="#9A5F0C" stroke-width="2"/><text x="${X(1.6449) - 8}" y="${Y(st.x95) - 8}" font-size="11" text-anchor="end" fill="#9A5F0C" font-weight="600">X95</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Log-probability plot of results"><rect x="${ml}" y="${mt}" width="${pw}" height="${ph}" fill="#fff" stroke="#B7C3CA"/>${g}${fl}${ol}${pts}${x95}<text x="${ml + pw / 2}" y="${H - 6}" font-size="11.5" text-anchor="middle" fill="#16232B">Cumulative probability (%)</text><text transform="translate(14 ${mt + ph / 2}) rotate(-90)" font-size="11.5" text-anchor="middle" fill="#16232B">Concentration (${esc(unit || 'unit')})</text></svg>
  <p class="hint" style="margin:6px 0 0">Filled: measured. Hollow: imputed non-detect. Dashed: fitted lognormal.</p>`;
}

function parseCSV(t) {

  for (let i = 0; i < t.length; i++) { const ch = t[i];
    if (q) { if (ch === '"' && t[i + 1] === '"') { cur += '"'; i++; } else if (ch === '"') q = false; else cur += ch; }
    else if (ch === '"') q = true; else if (ch === ',') { row.push(cur); cur = ''; } else if (ch === '\n' || ch === '\r') { if (ch === '\r' && t[i + 1] === '\n') i++; row.push(cur); rows.push(row); row = []; cur = ''; } else cur += ch; }

// ---------------- AI ----------------
function aiPayload() {
  const e = S.engagement;
  return { engagement: { type: e.type, site: e.site, client: e.client, scope: { facilities: e.facilities, workforce: e.workforce, seasons: e.seasons } },
    decisionStandard: { oelRule: S.decision.oelRule, test: S.decision.statTest, shiftModel: S.decision.shiftModel },
    profiles: S.profiles.map(p => { const a = analyseProfile(p), st = a.stats; return { profile: profLabel(p), appliedOEL: a.oelAdj ? `${F(a.oelAdj)} ${a.unit}` : null, n: st.n, gm: st.gm && F(st.gm), gsd: st.gsd && F(st.gsd), x95: st.x95 && F(st.x95), x95ucl: st.x95ucl && F(st.x95ucl), en689: st.en689 && st.en689.outcome, aihaCategory: st.aihaCat, finalCategory: p.decCat, outcome: p.decOutcome, rationale: p.decRationale }; }),
    recommendations: S.recs.map(r => ({ statement: r.statement, level: r.level, priority: r.priority })), openConcerns: S.concerns.filter(c => c.status !== 'Closed').map(c => c.desc) };
}
async function aiDraft() {
  if (!AI.key) { toast('Add an API key in Settings first.'); UI.tab = 'settings'; render(); return; }
  if (!confirm('This sends aggregated findings (no worker identities) to ' + AI.provider + '. Continue?')) return;
  const prompt = 'You are assisting a senior occupational hygienist. Draft an executive summary (180-250 words, plain prose, no headings, no bullet points) for management from these structured findings. State key risks and priority actions. Do not invent data, limits or results not given. Where a decision is not recorded, say it is pending.\n\n' + JSON.stringify(aiPayload(), null, 1);
  toast('Drafting\u2026');
  try {
    let text = '';
    if (AI.provider === 'anthropic') {
      const r = await fetch('https://api.anthropic.com/v1/messages', { method: 'POST', headers: { 'content-type': 'application/json', 'x-api-key': AI.key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' }, body: JSON.stringify({ model: AI.model, max_tokens: 1200, messages: [{ role: 'user', content: prompt }] }) });
      const j = await r.json(); if (!r.ok) throw new Error(j.error ? j.error.message : r.status); text = j.content.filter(c => c.type === 'text').map(c => c.text).join('\n');
    } else {
      const r = await fetch('https://api.openai.com/v1/chat/completions', { method: 'POST', headers: { 'content-type': 'application/json', 'authorization': 'Bearer ' + AI.key }, body: JSON.stringify({ model: AI.model, messages: [{ role: 'user', content: prompt }] }) });
      const j = await r.json(); if (!r.ok) throw new Error(j.error ? j.error.message : r.status); text = j.choices[0].message.content;
    }
    S.report.summary = text.trim(); S.report.summaryIsAI = true; commit('AI draft', 'Executive summary drafted by ' + AI.provider + ' ' + AI.model);
    toast('Draft added. Review it before issue.');
  } catch (err) { toast('AI request failed: ' + err.message); }
}

// ---------------- events ----------------
document.addEventListener('change', async ev => {
  const el = ev.target, ds = el.dataset || {};
  if (ds.ai) { AI[ds.ai] = el.type === 'checkbox' ? el.checked : el.value; saveAI(); scheduleRender(); return; }
  if (ds.arr) { const arr = getPath(S, ds.arr) || []; const v = el.value; const nv = el.checked ? [...new Set(arr.concat(v))] : arr.filter(x => x !== v); setPath(S, ds.arr, nv); commit('Edit scope', `${ds.arr}: ${el.checked ? 'added' : 'removed'} ${v}`); return; }
  if (ds.col && ds.id) {
    const rec = byId(ds.col, ds.id); if (!rec) return;
    const old = rec[ds.f], nv = readVal(el); rec[ds.f] = nv;
    if (ds.col === 'profiles' && ds.f === 'agentId' && !rec.avg) rec.avg = defaultAvg(nv);
    if (ds.col === 'profiles' && ['decCat', 'decOutcome', 'decRationale'].includes(ds.f)) { rec.decBy = ''; rec.decDate = ''; }
    if (S.signoff && ds.col !== 'audit') { toast('Signed report changed: sign-off withdrawn. Issue a new revision.'); audit('Sign-off withdrawn', 'Data changed after signing'); S.signoff = null; }
    commit('Edit ' + ds.col, `${ds.f}: ${String(old ?? '').slice(0, 60)} \u2192 ${String(nv ?? '').slice(0, 60)} [${ds.id}]`);
    return;
  }
  if (ds.obj) {
    if (ds.obj.startsWith('decision.') && S.decision.locked) return;
    if (S.signoff && ds.obj !== 'user') { toast('Signed report changed: sign-off withdrawn. Issue a new revision.'); audit('Sign-off withdrawn', 'Data changed after signing'); S.signoff = null; }
    const old = getPath(S, ds.obj); setPath(S, ds.obj, readVal(el));
    commit(ds.obj === 'user' ? null : 'Edit', `${ds.obj}: ${String(old ?? '').slice(0, 60)} \u2192 ${String(readVal(el) ?? '').slice(0, 60)}`);
  }
});
$('#fileIn').addEventListener('change', async ev => {
  const f = ev.target.files[0]; ev.target.value = ''; if (!f) return;
  try {
    let obj = JSON.parse(await f.text());
    if (obj.format === APP.format + '-encrypted') { const a = await ask('Encrypted file', 'Enter the passphrase used to save this file.', [{ l: 'Passphrase', t: 'password' }], 'Decrypt'); if (!a) return; obj = JSON.parse(await decryptText(obj, a[0])); }
    if (!obj.meta || obj.meta.format !== APP.format) throw new Error('Not an OHA Studio engagement file.');
    S = migrate(obj); anaCache.clear(); UI.profileId = null; const v = await verifyAudit();
    saveLocal(); audit('File opened', f.name + (v.ok ? '' : ' (audit chain FAILED verification)')); UI.tab = 'home'; render();
    toast(v.ok ? 'Engagement opened. Audit chain verified.' : 'Opened, but the audit chain failed verification.');
  } catch (err) { toast(err.name === 'OperationError' ? 'Wrong passphrase.' : 'Could not open file: ' + err.message); }
});
$('#csvIn').addEventListener('change', async ev => {
  const f = ev.target.files[0]; ev.target.value = ''; if (!f) return;
  const rows = parseCSV(await f.text()); if (rows.length < 2) return toast('CSV has no data rows.');
  const hd = rows[0].map(h => h.trim().toLowerCase()), ic = hd.indexOf('coc'), iv = hd.indexOf('value'), ind = hd.indexOf('nd');
  if (ic < 0 || iv < 0) return toast('CSV needs columns named coc and value.');
  let n = 0, miss = [];
  rows.slice(1).forEach(r => { const s = S.samples.find(x => x.coc === r[ic].trim()); if (!s) { miss.push(r[ic]); return; } s.value = Number(r[iv]); if (ind >= 0) s.nd = /^(1|true|yes|y|nd|<)$/i.test(r[ind].trim()); n++; });
  commit('Lab import', `${f.name}: ${n} results updated${miss.length ? ', unmatched: ' + miss.slice(0, 10).join(' ') : ''}`);
  toast(`${n} results imported${miss.length ? `; ${miss.length} sample IDs not found` : ''}.`);
});
document.addEventListener('click', async ev => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act;
  switch (act) {
    case 'tab': UI.tab = b.dataset.tab; render(); $('#main').scrollTop = 0; $('#main').focus({ preventScroll: true }); break;
    case 'add': { const rec = Object.assign({ id: uid(b.dataset.col.slice(0, 3)) }, JSON.parse(b.dataset.def || '{}')); S[b.dataset.col].push(rec); commit('Add ' + b.dataset.col, rec.id); break; }
    case 'del': { if (!confirm('Delete this row?')) return; const col = b.dataset.col, id = b.dataset.id; S[col] = S[col].filter(x => x.id !== id); if (col === 'profiles') S.samples = S.samples.filter(s => s.profileId !== id); commit('Delete ' + col, id); break; }
    case 'demo': if (S.audit.length && !confirm('Replace the current engagement with the demo?')) return; loadDemo(); anaCache.clear(); saveLocal(); audit('Demo loaded', 'Sour gas demo engagement'); UI.tab = 'home'; render(); toast('Demo loaded. Demo OEL values are placeholders, not real limits.'); break;
    case 'newEng': if (!confirm('Start a new engagement? Save the current one to file first if you need it.')) return; S = blank(); anaCache.clear(); saveLocal(); UI.tab = 'engagement'; render(); break;
    case 'lockStd': { if (!S.engagement.principal) { toast('Record the principal hygienist first.'); return; } S.decision.locked = true; S.decision.lockedBy = S.user || S.engagement.principal; S.decision.lockedAt = new Date().toISOString(); commit('Decision standard locked', JSON.stringify({ rule: S.decision.oelRule, test: S.decision.statTest, shift: S.decision.shiftModel })); break; }
    case 'unlockStd': { const a = await ask('Unlock decision standard', 'Changing the decision standard after agreement needs a recorded reason and client re-approval.', [{ l: 'Reason', t: 'area' }], 'Unlock'); if (!a || !a[0].trim()) return; S.decision.locked = false; commit('Decision standard unlocked', a[0]); break; }
    case 'loadReq': REQ_SOUR.forEach(item => { if (!S.datareq.some(d => d.item === item)) S.datareq.push({ id: uid('dr'), item, status: 'Requested' }); }); commit('Template', 'Sour gas data request list added'); break;
    case 'loadHaz': { const n = addHazLib(); commit('Template', n + ' agents added from sour gas hazard library'); toast(n + ' agents added. Enter their OELs.'); break; }
    case 'genProfiles': { let n = 0; S.segs.forEach(s => S.agents.forEach(a => { if (!S.profiles.some(p => p.segId === s.id && p.agentId === a.id)) { S.profiles.push({ id: uid('pf'), segId: s.id, agentId: a.id, avg: defaultAvg(a.id), scenario: 'Routine', conf: 'Medium', basis: 'Professional judgement' }); n++; } })); commit('Profiles generated', n + ' profiles'); toast(n + ' profiles created. Delete pairs that do not apply.'); break; }
    case 'selProfile': UI.profileId = b.dataset.id; render(); break;
    case 'recordDecision': { const p = byId('profiles', b.dataset.id); if (p.decCat === undefined || p.decCat === '' || p.decCat == null || !p.decRationale) { toast('Choose a final category and write the rationale first.'); return; } p.decBy = S.user || 'unnamed user'; p.decDate = today(); const a = analyseProfile(p); commit('Decision recorded', `${profLabel(p)}: category ${p.decCat}, ${p.decOutcome || ''}; X95 ${F(a.stats.x95)}, EN 689 ${a.stats.en689 ? a.stats.en689.outcome : 'n/a'}; engine v${OHStats.VERSION}`); toast('Decision recorded.'); break; }
    case 'ack': { const a = await ask('Acknowledge QA flag', 'Explain why the work can proceed. The note may appear in the report limitations.', [{ l: 'Note', t: 'area' }], 'Acknowledge'); if (!a || !a[0].trim()) return; S.qaAck[b.dataset.key] = { note: a[0], by: S.user || 'unnamed user', at: new Date().toISOString() }; commit('QA flag acknowledged', b.dataset.key + ': ' + a[0]); break; }
    case 'unack': delete S.qaAck[b.dataset.key]; commit('QA flag reopened', b.dataset.key); break;
    case 'saveFile': download(fileBase() + '.ohs.json', JSON.stringify(S, null, 1), 'application/json'); audit('File saved', fileBase()); setSave('Saved to file ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })); break;
    case 'saveEnc': { const a = await ask('Save encrypted file', 'AES-256-GCM with a key derived from your passphrase. There is no recovery if you lose it.', [{ l: 'Passphrase (12+ characters)', t: 'password' }, { l: 'Repeat passphrase', t: 'password' }], 'Encrypt and save'); if (!a) return; if (a[0].length < 12 || a[0] !== a[1]) { toast('Passphrases must match and be at least 12 characters.'); return; } download(fileBase() + '.encrypted.ohs.json', await encryptText(JSON.stringify(S), a[0]), 'application/json'); audit('Encrypted file saved', fileBase()); break; }
    case 'openFile': $('#fileIn').click(); break;
    case 'importCSV': $('#csvIn').click(); break;
    case 'exportRecs': download(fileBase() + '_recommendations.csv', toCSV([['Recommendation', 'Hierarchy', 'Priority', 'Profile', 'Rationale', 'Owner', 'Due', 'Verification', 'Status']].concat(S.recs.map(r => [r.statement, r.level, r.priority, profLabel(byId('profiles', r.profileId)), r.rationale, r.owner, r.due, r.verify, r.status]))), 'text/csv'); break;
    case 'exportCSVs': {
      download(fileBase() + '_SEG_register.csv', toCSV([['SEG ID', 'Name', 'Definition', 'Criteria', 'Tasks', 'Own staff', 'Contractors', 'Shift h', 'Rotation', 'Rationale', 'Status']].concat(S.segs.map(s => [s.code, s.name, s.definition, s.criteria, s.taskList, s.headOwn, s.headCon, s.shiftH, s.rotation, s.rationale, s.status]))), 'text/csv');
      setTimeout(() => download(fileBase() + '_results.csv', toCSV([['Sample', 'SEG', 'Agent', 'Averaging', 'Date', 'Worker', 'Duration min', 'Result', 'ND', 'Unit', 'Condition', 'Blank', 'Excluded', 'Reason']].concat(S.samples.map(s => { const p = byId('profiles', s.profileId) || {}; return [s.coc, nm('segs', p.segId, 'code'), nm('agents', p.agentId), p.avg, s.date, s.worker, s.durMin, s.value, s.nd ? 'Y' : '', analyseProfile(p).unit || '', s.cond, s.blank ? 'Y' : '', s.excluded ? 'Y' : '', s.exclReason]; }))), 'text/csv'), 400);
      break;
    }
    case 'exportPkg': {
      const pkg = { format: 'ohastudio-exposure-package', version: 1, exported: new Date().toISOString(), engine: OHStats.VERSION, site: S.engagement.site, client: S.engagement.client, decisionStandard: S.decision, agents: S.agents, oels: S.oels, segs: S.segs,
        profiles: S.profiles.map(p => { const a = analyseProfile(p); return { ...p, label: profLabel(p), appliedOEL: a.oelAdj, unit: a.unit, oelSource: a.sel.oel && a.sel.oel.source, stats: Object.fromEntries(Object.entries(a.stats).filter(([k]) => k !== 'plot')), reassessMonths: reassessMonths(p) }; }),
        samples: S.samples, recommendations: S.recs, moc: S.moc, handover: S.handover };
      download(fileBase() + '_exposure_package.json', JSON.stringify(pkg, null, 1), 'application/json'); audit('Exposure package exported', fileBase()); break;
    }
    case 'genReport': UI.reportHtml = reportHTML(); render(); break;
    case 'printReport': { const fr = $('#repFrame'); if (fr && fr.contentWindow) fr.contentWindow.print(); break; }
    case 'docReport': download(fileBase() + '_report.doc', UI.reportHtml.replace('<html lang="en">', '<html lang="en" xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word">'), 'application/msword'); break;
    case 'htmlReport': download(fileBase() + '_report.html', UI.reportHtml, 'text/html'); break;
    case 'sign': {
      const a = await ask('Sign and freeze', 'This records your name, credentials, the time and a SHA-256 hash of the current data. Any later change withdraws the sign-off.', [{ l: 'Name', v: S.engagement.principal }, { l: 'Credentials', v: '' }], 'Sign');
      if (!a || !a[0].trim()) return; const hash = await snapshotHash();
      S.signoff = { name: a[0], credentials: a[1], at: new Date().toISOString(), hash }; commit('Report signed', `${a[0]} (${a[1]}), snapshot ${hash}`); UI.reportHtml = ''; toast('Signed. Generate the preview to issue the report.'); break;
    }
    case 'unsign': { const a = await ask('Withdraw sign-off', 'The report returns to draft. Give the reason and set the next revision letter.', [{ l: 'Reason', t: 'area' }], 'Withdraw'); if (!a || !a[0].trim()) return; S.signoff = null; S.report.revision = String.fromCharCode((S.report.revision || 'A').charCodeAt(0) + 1); commit('Sign-off withdrawn', a[0]); break; }
    case 'verifyAudit': { await auditQ; const v = await verifyAudit(); toast(v.ok ? `Audit chain intact (${v.n} entries).` : `Audit chain broken at entry ${v.at + 1}.`); break; }
    case 'aiDraft': aiDraft(); break;
  }
});
